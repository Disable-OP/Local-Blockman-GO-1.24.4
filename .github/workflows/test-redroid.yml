name: test-redroid
# Boots the APK in Redroid (native arm64, Android 12) and runs the full
# UI automation suite: fresh account registration through the UI, login,
# every bottom tab, deep navigation — asserting the embedded local API
# server serves all traffic and the app never crashes.
# 2026-10-09 mandate: the suite now also SCREENSHOTS every phase boundary
# and runs PHASE GJ — the gameplay-join verification (client engine ->
# RakNet 127.0.0.1:31108 -> client.log login markers -> server.log/
# monitor G2R_USER_IN), in BOTH fast and deep modes.
# APK source: latest GitHub Release asset "BlockyNexus-localapi.apk".

on:
  # USER MANDATE 2026-10-07 (reinforced same day after runs 37598014388 /
  # 37603763817 / 37607065791 / 37611564558 / 37615459162 ran 22-32 min as
  # full-mode dispatches): "lower the test redroid time ... just make it
  # 5 minutes only ... TIME IS PRECIOUS". CI is therefore FAST-ONLY:
  # no mode input exists any more, every dispatch (even one that tries to
  # pass inputs) runs the ~5-minute fast suite. The deep-drive phases
  # remain in scripts/ui_automation_test.py (--mode full) for explicit
  # local/manual evidence runs ONLY - re-adding a full option to CI is a
  # deliberate diff decision, never a silent dispatch choice.
  workflow_dispatch:
  workflow_run:
    workflows: ["build-release"]
    types: [completed]

permissions:
  contents: read

jobs:
  redroid-test:
    runs-on: ubuntu-24.04-arm
    # Fast-only + GJ join verification (2026-10-09): expected wall ~8 min
    # (~75s infra + ~4.5 min UI suite + ~2.5 min GJ join poll); cap 16 min
    # so a hang can never hold the runner for half an hour again.
    timeout-minutes: 16
    env:
      PACKAGE: com.disabngo.blockynexus
      ACTIVITY: com.disabngo.blockynexus.view.activity.start.StartActivity
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # workflow_run fires on the default branch (= main = the only branch)

      - name: Fetch latest patched APK from releases (prerelease-aware)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_release_asset.py BlockyNexus-localapi.apk app.apk

      # Fast path (2026-10-07, ~30s saved): the GH runner image usually
      # already ships the binder module + adb - only pay for apt update+
      # install when modprobe actually fails.
      - name: Load binder kernel module
        run: |
          if ! sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null; then
            echo "modprobe failed - installing kernel modules + adb"
            sudo apt-get update -qq
            sudo apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb
            sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          fi
          command -v adb >/dev/null 2>&1 || { sudo apt-get update -qq; sudo apt-get install -y -qq android-tools-adb; }
          adb version | head -1

      - name: Start Redroid (arm64 native, Android 12)
        run: |
          docker run -d --name redroid --privileged -p 5555:5555 \
            redroid/redroid:12.0.0-latest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320 \
            androidboot.redroid_gpu_mode=guest
          adb connect localhost:5555

      - name: Wait for Android boot
        run: |
          for i in $(seq 1 48); do
            b=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$b" = "1" ] && echo "boot completed" && exit 0
            echo "waiting for boot ($i/48)"; sleep 5
          done
          echo "DEVICE FAILED TO BOOT"; exit 1

      - name: Install APK
        run: |
          adb -s localhost:5555 install -r -t app.apk

      - name: Launch + 10s keep-alive check
        run: |
          adb -s localhost:5555 logcat -c
          adb -s localhost:5555 shell am start -n "$PACKAGE/$ACTIVITY"
          sleep 10
          if adb -s localhost:5555 shell pidof "$PACKAGE" | grep -qE '[0-9]'; then
            echo "APP ALIVE after 10s"
            adb -s localhost:5555 shell pidof "$PACKAGE"
          else
            echo "APP PROCESS DIED within 10s"
            adb -s localhost:5555 logcat -d | tail -100
            exit 1
          fi

      - name: Run UI automation suite (register, login, navigate all tabs)
        # FAST mode + PHASE GJ (2026-10-09: gameplay-join verification
        # runs in BOTH modes): the suite itself must finish in ~7 min -
        # Phase A core (visitor + tabs + boot surfaces), PHASE GJ (real
        # UI join + client.log/RakNet/monitor verification, ~2.5 min),
        # Phase P (sign banner), Phase C (fresh account via the local
        # API), Phase D core (upgrade + restart) + assertions/crash scan.
        # The deep-drive phases (B, E-O) are NOT reachable from CI - pass
        # --mode full by hand / dispatch test-redroid-deep when deep
        # evidence is needed.
        timeout-minutes: 12
        run: |
          python3 scripts/ui_automation_test.py \
            --serial localhost:5555 \
            --package "$PACKAGE" \
            --activity "$ACTIVITY" \
            --mode fast

      - name: GameServer smoke (process + RakNet listen + engine logs)
        if: always()
        run: |
          echo "== gameserver process =="
          adb -s localhost:5555 shell "ps -A | grep -i gameserver" || true
          echo "== RakNet 31108 listen probe (/proc/net/udp, 31108=0x7994) =="
          adb -s localhost:5555 shell "cat /proc/net/udp" 2>/dev/null | grep -i '7994' || echo "no :7994 UDP socket visible to shell"
          echo "== localapi boot logs (gs tags) =="
          adb -s localhost:5555 logcat -d -s LocalAPI:* GS:* | grep -iE "gs:|gameserver|monitor|g2r|dispatch" | tail -40 || true
          # resolve the runtime storage id dynamically (never hardcode /emulated/NN)
          LOGDIR=$(adb -s localhost:5555 shell 'ls -d /storage/emulated/*/SandBoxOL/BlockMan/config 2>/dev/null' | tr -d '\r' | head -1)
          echo "resolved config dir: ${LOGDIR:-<none>}"
          if [ -n "$LOGDIR" ]; then
            adb -s localhost:5555 shell "ls -la $LOGDIR" || true
            if adb -s localhost:5555 shell "test -f $LOGDIR/client.log"; then
              echo "== client.log tail (CLIENT ENGINE words) =="
              adb -s localhost:5555 shell "tail -c 8192 $LOGDIR/client.log" || true
            else
              echo "client.log not yet present"
            fi
            if adb -s localhost:5555 shell "test -f $LOGDIR/server.log"; then
              echo "== server.log tail (GAMESERVER words) =="
              adb -s localhost:5555 shell "tail -c 8192 $LOGDIR/server.log" || true
            else
              echo "server.log not yet present (gameplay server may not have started)"
            fi
          else
            echo "SandBoxOL/BlockMan/config not found on this device"
          fi

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p diags
          adb -s localhost:5555 logcat -d > diags/logcat.txt || true
          adb -s localhost:5555 logcat -d -b crash > diags/crash.txt || true
          adb -s localhost:5555 logcat -d -b events > diags/events.txt || true
          adb -s localhost:5555 logcat -d -b system > diags/system.txt || true
          adb -s localhost:5555 logcat -d -s LocalAPI > diags/localapi.txt || true
          adb -s localhost:5555 shell cat /proc/meminfo > diags/meminfo.txt || true
          adb -s localhost:5555 shell dumpsys meminfo > diags/meminfo-app.txt || true
          adb -s localhost:5555 shell uiautomator dump /sdcard/final_ui.xml >/dev/null 2>&1 || true
          adb -s localhost:5555 pull /sdcard/final_ui.xml diags/final_ui.xml || true
          adb -s localhost:5555 shell dumpsys activity processes > diags/processes.txt || true
          # engine logs: client.log (the client's own log) + server.log —
          # resolved across ALL storage profiles (2026-10-09: the user's
          # profile is /storage/emulated/0/...; redroid may differ)
          for LOGDIR in $(adb -s localhost:5555 shell 'ls -d /storage/emulated/*/SandBoxOL/BlockMan/config 2>/dev/null' | tr -d '\r'); do
            echo "pulling engine logs from $LOGDIR"
            adb -s localhost:5555 pull "$LOGDIR/client.log" diags/client.log 2>/dev/null || true
            adb -s localhost:5555 pull "$LOGDIR/server.log" diags/server.log 2>/dev/null || true
            adb -s localhost:5555 shell "ls -la $LOGDIR" > diags/config-dir-listing.txt 2>&1 || true
          done
          # SCREENSHOTS from every phase boundary + checkpoint (2026-10-09
          # mandate) and assertion-miss snaps (e.g. snap_H_reward_dialog_missing)
          for f in $(adb -s localhost:5555 shell ls /sdcard/snap_*.png 2>/dev/null | tr -d '\r'); do
            adb -s localhost:5555 pull "$f" diags/ || true
          done
          tar czf redroid-diagnostics.tgz diags || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-diagnostics
          path: redroid-diagnostics.tgz
          if-no-files-found: ignore
