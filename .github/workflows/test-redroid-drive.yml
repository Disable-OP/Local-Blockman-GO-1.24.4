name: test-redroid-drive
# THE PRISTINE-CLIENT DRIVE — ON_DEVICE_DRIVE.md §6 automated on the redroid
# (session 86; the delta-13 architecture finally executed end to end).
#
# WHAT RUNS WHERE (doc §1):
#   harness  com.disabngo.blockynexus (BlockyNexus-localapi.apk, the 1.24.4
#            custom build + gs-line.json -> the g10078 engine line):
#              holder 127.0.0.1:18080 (397+ routes, the game icons, dispatch)
#              driveTLS 127.0.0.1:443 (DriveTls, drive/server.p12)
#              GameServer libgameserver.so (the g10078 bundle v7 staged from
#              the release at boot; the v7 event-layer repair inside)
#   pristine com.sandboxol.blockymods (official-bg-2.8.2-v7a-4151.apk,
#            UNMODIFIED — nothing for the TSS to detect; run 38252063346
#            proved it survives 300s on this same redroid).
#   /etc/hosts: the 3 API hosts -> 127.0.0.1; CA in the SYSTEM store;
#   iptables :80 -> 18080; static hosts stay REAL (CDN still serves
#   appres/maps — by design).
#   The holder's dispatch steers the pristine client's join onto
#   127.0.0.1:31108 (gameType g1008 first; per-game via selectGame).
#
# THE DRIVE (per docs/ON_DEVICE_DRIVE.md §6, one join per game spec):
#   step 1 = the pristine client's login lands on OUR holder (the hall
#            renders — no hall without the holder answering).
#   step 2+ = per-game UI joins (card -> detail -> btn_enter) with the
#            drive verdict chain: game/auth REQ -> /v1/dispatch ->
#            BlockManEchoesActivity -> client.log initGame 127.0.0.1:31108
#            -> emConnectSuc -> login succ -> server.log C2SPacketLogin ->
#            monitor g2r type=151 (the human in the room; bots read from
#            the same monitor log as evidence).
#
# PREREQ: the harness asset must carry gs-line.json (session 86 build) so
# its GameServerManager stages the g10078 bundle. The build-release run for
# commit 78eeb6b+ (or any later) is the first eligible asset.

on:
  workflow_dispatch:
    inputs:
      harness_asset:
        description: 'Release asset name of the 1.24.4 harness APK'
        default: 'BlockyNexus-localapi.apk'
      games:
        description: 'Comma list of card_regex::label pairs (hall-card match)'
        default: 'bed\s*war::Bedwars (g1008)'
  # CRON-SESSION-6: the cron session PAT has NO actions:write (the
  # /dispatches endpoint 403s "Must have admin rights"), so the drive is
  # now ALSO push-triggered on the engine-line paths + this file. A push
  # that carries a scripts/gameserver/** change means build-gameserver
  # runs too - the wait step below holds the drive until that build's
  # asset lands (the drive fetches libgameserver-arm64.so per run).
  push:
    branches:
      - main
    paths:
      - "scripts/gameserver/**"
      - ".github/workflows/test-redroid-drive.yml"

permissions:
  contents: write

jobs:
  redroid-pristine-drive:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    env:
      HARNESS_PKG: com.disabngo.blockynexus
      HARNESS_ACT: com.disabngo.blockynexus.view.activity.start.StartActivity
      PRISTINE_PKG: com.sandboxol.blockymods
      PRISTINE_ACT: com.sandboxol.blockymods.view.activity.host.HostActivity
      GAMES: ${{ github.event.inputs.games || 'bed\s*war::Bedwars (g1008),sky\s*block::Skyblock (g1048)' }}
      HARNESS_ASSET: ${{ github.event.inputs.harness_asset || 'BlockyNexus-localapi-sandbox92.apk' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait for the gameserver build of this sha (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          # A scripts/gameserver/** push also fires build-gameserver; the
          # drive must run against ITS asset (libgameserver-arm64.so is
          # clobbered per build). A workflow/docs-only push has no build
          # run and proceeds immediately.
          # RUN-30 POSTMORTEM: the silent `|| echo "[]"` fallback let a
          # FAILING gh call pass as "no build" while the build was still
          # compiling - the holder then staged the PREVIOUS build's lib
          # (md5 074218d4... = build #45 instead of #47) and the whole
          # run tested a stale binary. gh failures are now FATAL when
          # this push touched scripts/gameserver/** (a build MUST exist);
          # docs/workflow-only pushes proceed with no build.
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^scripts/gameserver/'; then
            NEED_BUILD=1
          else
            NEED_BUILD=0
          fi
          echo "NEED_BUILD=$NEED_BUILD"
          for i in $(seq 1 55); do
            if ! RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" \
                 --workflow=build-gameserver.yml --commit "$SHA" \
                 --json status,conclusion --limit 1 2>/dev/null); then
              if [ "$NEED_BUILD" = "1" ]; then
                echo "gh run list FAILED and this push touched scripts/gameserver - aborting (the drive would stage a stale lib)"; exit 1
              fi
              echo "gh run list failed on a no-build push - proceeding"; exit 0
            fi
            if [ -z "$RUNS" ] || [ "$RUNS" = "[]" ]; then
              if [ "$NEED_BUILD" = "1" ]; then
                echo "no gameserver build run for $SHA but this push touched scripts/gameserver - aborting"; exit 1
              fi
              echo "no gameserver build for $SHA - proceeding"
              exit 0
            fi
            STATE=$(echo "$RUNS" | python3 -c 'import json,sys;r=json.load(sys.stdin)[0];print(r["status"]+":"+str(r["conclusion"]))')
            echo "build state: $STATE (round $i)"
            case "$STATE" in
              completed:success) echo "build landed - proceeding"; exit 0;;
              completed:*) echo "build FAILED - aborting the drive"; exit 1;;
            esac
            sleep 100
          done
          echo "timed out waiting for the gameserver build"; exit 1

      - name: Fetch the harness + pristine APKs from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch_release_asset.py "$HARNESS_ASSET" harness.apk
          python3 scripts/fetch_release_asset.py official-bg-2.8.2-v7a-4151.apk pristine282.apk
          ls -la harness.apk pristine282.apk

      - name: Load binder kernel module
        run: |
          if ! sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb
            sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          fi
          # THE DRIVE'S iptables REDIRECT (docs/ON_DEVICE_DRIVE.md §4 step 3):
          # the redroid container's netns needs the host kernel's netfilter
          # modules (the container cannot modprobe). run-3 lesson: without
          # ip_tables/iptable_nat, Android's iptables -t nat fails and the
          # whole drive dies at ondrive_setup step 3.
          for M in ip_tables iptable_nat nf_nat nf_conntrack x_tables \
                   nf_defrag_ipv4 nfnetlink; do
            sudo modprobe $M 2>/dev/null && echo "modprobe $M ok" \
              || echo "modprobe $M unavailable (may be builtin)"
          done
          command -v adb >/dev/null 2>&1 || { sudo apt-get update -qq; sudo apt-get install -y -qq android-tools-adb; }
          adb version | head -1

      - name: Start Redroid (arm64 native, Android 12)
        run: |
          docker run -d --name redroid --privileged -p 5555:5555 \
            redroid/redroid:12.0.0-latest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320 \
            androidboot.redroid_gpu_mode=guest
          adb connect localhost:5555

      - name: Wait for Android boot
        run: |
          for i in $(seq 1 48); do
            b=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$b" = "1" ] && echo "boot completed" && exit 0
            echo "waiting for boot ($i/48)"; sleep 5
          done
          echo "DEVICE FAILED TO BOOT"; exit 1

      - name: Root adb (the drive kit needs a real root shell)
        run: |
          adb -s localhost:5555 root || true
          sleep 3
          adb -s localhost:5555 wait-for-device
          adb -s localhost:5555 shell id
          # phantom process killer off (the GameServer spawns engine children)
          adb -s localhost:5555 shell settings put global settings_enable_monitor_phantom_procs false || true
          adb -s localhost:5555 shell device_config put activity_manager max_phantom_processes 2147483647 || true
          adb -s localhost:5555 shell setprop persist.device_config.runtime_native.usap_pool_enabled false || true

      - name: Generate the drive material + install the harness
        # ORDER MATTERS: install the harness FIRST (its filesDir must exist
        # with the app uid) -> stage drive/ (the p12 is read at BOOT) ->
        # launch.
        run: |
          python3 scripts/gen_drive_ca.py --force
          ls -la drive/
          adb -s localhost:5555 install -r -t -g harness.apk
          adb -s localhost:5555 push drive /sdcard/drive
          adb -s localhost:5555 push scripts/ondrive_setup.sh /sdcard/drive/ondrive_setup.sh
          adb -s localhost:5555 push scripts/ondrive_collect.sh /sdcard/drive/ondrive_collect.sh
          adb -s localhost:5555 shell chmod 644 /sdcard/drive/*.sh 2>/dev/null || true
          echo "== on-device iptables probe (the real failure names itself) =="
          adb -s localhost:5555 shell "iptables -t nat -L OUTPUT 2>&1 | head -4" || true
          adb -s localhost:5555 shell "sh /sdcard/drive/ondrive_setup.sh"

      - name: Stage the build's libgameserver over the bundled one (run-31 postmortem)
        # THE RUN-31 DECODE: the harness APK BUNDLES libgameserver.so in
        # lib/arm64-v8a/ (51166896 B, md5 074218d4... = the pre-#45 binary);
        # the PM extracts it to /data/app/.../lib/arm64/ and the holder
        # stages THAT - the per-run download NEVER reached the wire, so
        # runs 24-31 all tested the SAME pre-fix binary (the 'inert insert'
        # mystery = moot; the fixes were never wire-tested). This step
        # fetches the CURRENT (post-wait) build asset and overwrites the
        # staged lib BEFORE the GameServer boots. The md5 = logged into
        # evidence-lib-stage.md5 (the harvest picks evidence-* up).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch_release_asset.py libgameserver-arm64.so /tmp/libgameserver-arm64.so
          ls -la /tmp/libgameserver-arm64.so
          md5sum /tmp/libgameserver-arm64.so | tee evidence-lib-stage.md5
          adb -s localhost:5555 push /tmp/libgameserver-arm64.so /data/local/tmp/libgameserver-stage.so
          TARGET=$(adb -s localhost:5555 shell "find /data/app -name 'libgameserver.so' 2>/dev/null | head -1" | tr -d '\r')
          echo "staged lib path: $TARGET"
          [ -n "$TARGET" ] || { echo "no staged libgameserver found under /data/app"; exit 1; }
          adb -s localhost:5555 shell "cp /data/local/tmp/libgameserver-stage.so '$TARGET' && chmod 755 '$TARGET'; chown system:system '$TARGET' 2>/dev/null; restorecon '$TARGET' 2>/dev/null; md5sum '$TARGET'; ls -la '$TARGET'" | tee -a evidence-lib-stage.md5
          adb -s localhost:5555 push evidence-lib-stage.md5 /sdcard/drive/evidence-lib-stage.md5

      - name: Boot the harness (holder + driveTLS + GameServer staging)
        run: |
          adb -s localhost:5555 logcat -G 4M || true
          adb -s localhost:5555 logcat -c
          adb -s localhost:5555 shell am start -n "$HARNESS_PKG/$HARNESS_ACT"
          sleep 15
          if ! adb -s localhost:5555 shell pidof "$HARNESS_PKG" | grep -qE '[0-9]'; then
            echo "HARNESS DIED within 15s"; adb -s localhost:5555 logcat -d | tail -120; exit 1
          fi
          echo "harness alive: $(adb -s localhost:5555 shell pidof "$HARNESS_PKG")"
          adb -s localhost:5555 exec-out screencap -p > harness-boot.png || true

      - name: Holder + driveTLS probe (the drive's network contract)
        run: |
          adb -s localhost:5555 forward tcp:18090 tcp:18080
          CODE=000
          for i in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -s -o /tmp/holder_probe.json -w "%{http_code}" \
              "http://127.0.0.1:18090/health" || true)
            [ "$CODE" = "200" ] && break
            echo "probe $i: http=$CODE (holder may still be binding)"; sleep 5
          done
          echo "holder probe: http=$CODE"; head -c 300 /tmp/holder_probe.json || true
          [ "$CODE" = "200" ] || { echo "FATAL: holder never answered"; \
            adb -s localhost:5555 logcat -d -s LocalAPI:* | tail -80; exit 1; }
          echo "== drive-tls lines =="
          adb -s localhost:5555 logcat -d -s LocalAPI:* | grep -iE "drive-tls|gs: |stageVersion|staging|gameicons" | tail -25 || true

      - name: Wait for the GameServer (the g10078 bundle stages at boot)
        # The bundle is a 100 MB release download on first boot; the gs
        # engine launch is the marker. Hard-fail: a drive without a
        # GameServer is pointless.
        run: |
          ok=0
          for i in $(seq 1 60); do
            LOG=$(adb -s localhost:5555 logcat -d -s LocalAPI:* 2>/dev/null)
            if echo "$LOG" | grep -q "gs: launched pid="; then ok=1; break; fi
            if [ $((i % 6)) -eq 0 ]; then
              echo "-- staging progress ($i) --"
              echo "$LOG" | grep -iE "gs: |stage|download|bundle" | tail -6
            fi
            sleep 10
          done
          adb -s localhost:5555 logcat -d -s LocalAPI:* | grep -iE "gs: |stage|gameicons" | tail -30 || true
          [ "$ok" = "1" ] || { echo "FATAL: GameServer never launched"; exit 1; }
          echo "== gs process =="
          adb -s localhost:5555 shell "ps -A | grep -i gameserver" || true
          echo "== RakNet 31108 (0x7994) =="
          adb -s localhost:5555 shell "cat /proc/net/udp /proc/net/udp6 2>/dev/null" | grep -i '7994' || echo "(no udp socket visible)"

      - name: Re-verify the drive hops (TLS through the redirected host)
        run: |
          adb -s localhost:5555 shell "sh /sdcard/drive/ondrive_setup.sh" || true

      - name: Protect the harness from the cached-process + phantom kills (run-16 root cause)
        # RUN-16 DECODE (38503765221): the harness itself was SIGKILLed —
        # "Process com.disabngo.blockynexus (pid 2003) has died: cch CAC" +
        # "Process 2003 exited due to signal 9" — the moment the pristine
        # client came foreground the harness went CACHED and Android's
        # cached-process management killed it, taking the holder AND the
        # GameServer (its child) down mid-join; the client's 10 s RakNet
        # retry window then expired on a dead server. The old server ALSO
        # died as a PhantomProcessRecord 13 ms BEFORE our own stale sweep.
        # Two layers: (1) the Android-12 phantom-process monitor off +
        # the phantom budget maxed; (2) a device-side oom_score_adj guard
        # re-asserting -1000 on the harness pid every 2 s (AMS re-computes
        # the adj on every state change, so a one-shot write would not
        # survive; the child libgameserver inherits the parent's adj at
        # fork, so keeping the harness protected covers the server too).
        run: |
          adb -s localhost:5555 shell "settings put global settings_enable_monitor_phantom_procs false" || true
          adb -s localhost:5555 shell "device_config set_sync_disabled_for_tests persistent" || true
          adb -s localhost:5555 shell "device_config put activity_manager max_phantom_processes 2147483647" || true
          adb -s localhost:5555 shell "device_config get activity_manager max_phantom_processes" || true
          cat > /tmp/oomguard.sh <<'EOF'
          while true; do
            P=$(pidof com.disabngo.blockynexus)
            if [ -n "$P" ]; then
              for pid in $P; do
                echo -1000 > /proc/$pid/oom_score_adj 2>/dev/null
              done
            fi
            # RUN-20 DECODE (38518243375): the HARNESS pid was protected
            # but the libgameserver CHILD was not — AMS re-computes the
            # child's own adj (a bare native child has no activity/
            # service records, so it goes CACHED when the pristine is
            # foreground) and the gs was DEAD before the Bedwars join
            # (gsproc=none every round; the Skyblock half only worked
            # because the join-time respawn re-launched it). Protect the
            # child's pid too — the fork-inheritance covers only the
            # adj AT fork time, not later AMS recomputes.
            G=$(ps -A -o PID,NAME 2>/dev/null | grep -w libgameserver.so | awk '{print $1}')
            if [ -n "$G" ]; then
              for pid in $G; do
                echo -1000 > /proc/$pid/oom_score_adj 2>/dev/null
              done
            fi
            sleep 2
          done
          EOF
          adb -s localhost:5555 push /tmp/oomguard.sh /data/local/tmp/oomguard.sh
          adb -s localhost:5555 shell "chmod 755 /data/local/tmp/oomguard.sh; nohup /data/local/tmp/oomguard.sh >/dev/null 2>&1 &"
          sleep 3
          echo "== oom_score_adj now =="
          HP=$(adb -s localhost:5555 shell pidof com.disabngo.blockynexus | tr -d '\r')
          for pid in $HP; do
            adb -s localhost:5555 shell "cat /proc/$pid/oom_score_adj" || true
          done

      - name: Rebuild the pristine with the SkyBlock UI + the avatar actors (run-33 postmortem)
        # THE RUN-33 DECODE: the app_resources/Media/GUI/UI placement did
        # NOT reach the engine — the sub-actor error persisted despite the
        # placed files too — so the GUI/actor Media resolver reads THE APK
        # ASSETS ONLY (AAssetManager; + the map dir). The pristine 2.8.2
        # ships ZERO SkyBlock* UI windows (2.8.2 predates the SkyBlock UI;
        # the g1048 appres carries none) = the null main window = the 3 s
        # SIGSEGV. FIX: rebuild the pristine APK in-place here — add the
        # 4151-era SkyBlock UI jsons (from the harness base, the same
        # engine line) + the g1008 avatar actor set (from the official
        # g1046 appres) into assets/resources/Media/, strip META-INF,
        # zipalign + debug-sign. The TSS risk = covered by the launch
        # step's 20 s alive check (it names the tamper verdict loudly).
        run: |
          curl -sSfL -o /tmp/uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          curl -sS -o /tmp/appres-g1046.zip \
            "https://staticgs.sandboxol.com/sandbox/games/app-game-engine-resources/appres-g1046-10078.1625198960711.zip"
          echo "a9b2dd94151f72b39e24d278889ca35d63a64c005c4841a8eac7f60ac4752677  /tmp/appres-g1046.zip" | sha256sum -c -
          python3 - <<'PYEOF'
          import zipfile, os, hashlib
          ORIG, HARNESS, G1046 = 'pristine282.apk', 'harness.apk', '/tmp/appres-g1046.zip'
          ADD = []
          with zipfile.ZipFile(HARNESS) as zh:
              n = 0
              for name in zh.namelist():
                  if (name.startswith('assets/resources/Media/GUI/UI/')
                          and 'skyblock' in name.lower() and name.endswith('.json')):
                      ADD.append((name, zh.read(name))); n += 1
          print('SkyBlock UI jsons from the harness base:', n)
          assert n >= 20, 'SkyBlock UI extraction incomplete'
          with zipfile.ZipFile(G1046) as zg:
              for a in ('g1008_boy.actor', 'g1008_girl.actor',
                        'g1008_skin.actor', 'g1008_skin2.actor'):
                  ADD.append(('assets/resources/Media/Actor/' + a,
                              zg.read('Scripts/Game/g1008/res/actor/' + a)))
          with zipfile.ZipFile(ORIG) as zin, \
               zipfile.ZipFile('pristine-patched.apk.tmp', 'w', zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  if item.filename.startswith('META-INF/'):
                      continue  # the official signature dies here
                  zout.writestr(item, zin.read(item.filename))
              for path, payload in ADD:
                  zi = zipfile.ZipInfo(path, (2026, 1, 1, 0, 0, 0))
                  zi.external_attr = 0o644 << 16
                  zout.writestr(zi, payload, zipfile.ZIP_DEFLATED)
          os.replace('pristine-patched.apk.tmp', 'pristine-patched.apk')
          print('packed pristine-patched.apk', os.path.getsize('pristine-patched.apk'),
                'md5', hashlib.md5(open('pristine-patched.apk','rb').read()).hexdigest())
          PYEOF
          java -jar /tmp/uber-apk-signer.jar --apks pristine-patched.apk --out .
          SIGNED=$(ls pristine-patched-*igned*.apk | head -1)
          echo "signed: $SIGNED"
          mv -f "$SIGNED" pristine282.apk
          md5sum pristine282.apk | tee evidence-pristine-build.md5
          unzip -l pristine282.apk | grep -c "SkyBlockMain.json" \
            || { echo "FATAL: SkyBlockMain.json missing from the rebuilt pristine"; exit 1; }

      - name: Install the PRISTINE 2.8.2 client
        run: |
          adb -s localhost:5555 install -r -t -g pristine282.apk
          adb -s localhost:5555 shell appops set "$PRISTINE_PKG" LEGACY_STORAGE allow || true
          adb -s localhost:5555 shell appops set "$PRISTINE_PKG" MANAGE_EXTERNAL_STORAGE allow || true
          adb -s localhost:5555 shell pm grant "$PRISTINE_PKG" android.permission.WRITE_EXTERNAL_STORAGE 2>/dev/null || true
          adb -s localhost:5555 shell getprop ro.product.cpu.abilist
          adb -s localhost:5555 shell pm path "$PRISTINE_PKG" | head -2

      - name: Pre-place the pristine hall map + config dirs (run-7 CreateDir(17) workaround)
        # RUN-7 DECODE (the farthest drive evidence, artifact 11845052692):
        # the 2.8.2 engine's native PathUtil::CreateDir dies on the
        # emulated-storage chain ("error code = [17] (EEXIST), dir =
        # [storage/emulated/]" — run 7 logcat 19:52:19.224) so it can NEVER
        # mkdir its own mapPath/configPath. The hall join then dies on
        # CGame::onDownloadMapFailure x2 (map hunger_game_1, mapUrl[] EMPTY —
        # the client's join chain copies only signature/timestamp from the
        # auth token, so mapUrl can never arrive) and the local hall world
        # stays a black screen forever. The engine's default hall map name
        # is hunger_game_1 (EchoesGLSurfaceView: realmsResult.mapName==null
        # -> "hunger_game_1"). The workflow (adb root) pre-creates BOTH
        # trees under the PRISTINE app's own external dir and places the
        # era-correct maps:
        #   g1046 hall -> BedWarHall.1596795531126.zip (the official CDN's
        #                 own g1046 map — GameTip/g1046.csv inside) as
        #                 hunger_game_1 (the engine's expected dir name)
        #   g1008 room -> m1008_2.1625226508247.zip (the release maps pack,
        #                 the same id the on-device GameServer hosts)
        #   g1048 sky  -> m1048_1.1625218507296.zip (the Skyblock card join;
        #                 the engine can NEVER mkdir its own trees on the
        #                 emulated storage (run-7 quirk) so the download
        #                 path can never self-heal — pre-place it too)
        # NESTED LAYOUT (run-12 decode, 38487378638): mapExistsAndValid
        # walks <mapdir>/<mapName>/<mapReal>/ — mapName = the client map
        # dir (hunger_game_1 / m1048_1 / m1008_2), mapReal = the download
        # zip's stem. checksums.md5 + the map files live INSIDE the nested
        # mapReal dir, the zip sits NEXT to it (mapZipPath). The direct
        # layout (sessions 87-11) was wrong from birth — every earlier run
        # died before the layout check (traversal, then the missing zip)
        # and never revealed it. Ownership is chowned to the pristine uid
        # so the engine can write its logs/temp next to the map.
        run: |
          set -e
          PKG="$PRISTINE_PKG"
          # the app's external files dir may not exist before the FIRST
          # launch (run 9: stat returned empty -> the chowns no-op'd) —
          # the DATA dir always exists right after pm install
          UP=$("adb" -s localhost:5555 shell "stat -c %u /data/data/$PKG" | tr -d '\r')
          echo "pristine uid: $UP"
          curl -sS -o /tmp/BedWarHall.zip \
            "https://staticgs.sandboxol.com/sandbox/games/maps/BedWarHall.1596795531126.zip"
          echo "dc53d7665e1b691c8099f2f1479fbf9ad288c6c100dfd6afcebcaa4fcfaf7f7c  /tmp/BedWarHall.zip" | sha256sum -c -
          curl -sSL -o /tmp/maps.tar.gz \
            "https://github.com/Disable-OP/Local-Blockman-GO-1.24.4/releases/download/localapi-assets/maps.tar.gz"
          echo "e86ac824030de9503f7eb2f7b3bc3248d1abfc0f84914b0c27b8976581ba5672  /tmp/maps.tar.gz" | sha256sum -c -
          rm -rf /tmp/bwh /tmp/m1008 /tmp/m1048 && mkdir -p /tmp/bwh /tmp/m1008 /tmp/m1048
          (cd /tmp/bwh && unzip -q /tmp/BedWarHall.zip)
          # the pack is a tar.gz (no wrapping dir): extract exactly the
          # bundle zips the on-device GameServer also runs
          tar -xzf /tmp/maps.tar.gz -C /tmp/m1008 \
            "sandbox/games/maps/m1008_2.1625226508247.zip"
          tar -xzf /tmp/maps.tar.gz -C /tmp/m1048 \
            "sandbox/games/maps/m1048_1.1625218507296.zip"
          rm -rf /tmp/m1008x /tmp/m1048x && mkdir -p /tmp/m1008x /tmp/m1048x
          (cd /tmp/m1008x && unzip -q /tmp/m1008/sandbox/games/maps/m1008_2.1625226508247.zip)
          (cd /tmp/m1048x && unzip -q /tmp/m1048/sandbox/games/maps/m1048_1.1625218507296.zip)
          for SPELL in SandboxOL SandBoxOL; do
            for SEG in "Download/$SPELL" "$SPELL"; do
              MAP="/storage/emulated/0/Android/data/$PKG/files/$SEG/BlockMan/map"
              CFG="/storage/emulated/0/Android/data/$PKG/files/$SEG/BlockMan/config"
              # the nested mapReal dirs + the client map dirs
              adb -s localhost:5555 shell "mkdir -p '$MAP/hunger_game_1/BedWarHall.1596795531126' '$MAP/m1008_2/m1008_2.1625226508247' '$MAP/m1048_1/m1048_1.1625218507296' '$CFG'"
              # hunger_game_1 (the Bedwars hall): files INSIDE the nested
              # mapReal dir, the zip NEXT to it
              adb -s localhost:5555 push /tmp/bwh/.        "$MAP/hunger_game_1/BedWarHall.1596795531126/"
              adb -s localhost:5555 push /tmp/BedWarHall.zip "$MAP/hunger_game_1/BedWarHall.1596795531126.zip"
              # m1008_2 (the g1008 room) + m1048_1 (the Skyblock join)
              adb -s localhost:5555 push /tmp/m1008x/.     "$MAP/m1008_2/m1008_2.1625226508247/"
              adb -s localhost:5555 push /tmp/m1008/sandbox/games/maps/m1008_2.1625226508247.zip "$MAP/m1008_2/m1008_2.1625226508247.zip"
              adb -s localhost:5555 push /tmp/m1048x/.     "$MAP/m1048_1/m1048_1.1625218507296/"
              adb -s localhost:5555 push /tmp/m1048/sandbox/games/maps/m1048_1.1625218507296.zip "$MAP/m1048_1/m1048_1.1625218507296.zip"
              adb -s localhost:5555 shell "chown -R $UP:$UP '$MAP' '$CFG'" || true
              adb -s localhost:5555 shell "chmod -R 777 '$MAP' '$CFG'" || true
            done
          done
          # RUN-10 LESSON (38478884394): the LEAF chown is not enough.
          # Every dir the mkdir -p created ABOVE the leaves (files/Download,
          # files/SandboxOL, .../BlockMan) is root:ext_data_rw 2770 and the
          # app uid's path walk dies at the first root-owned intermediate —
          # the engine's stat of the map root failed ("mapExistsAndValid
          # root dir is missing") and its self-heal mkdir failed ("create
          # dir fail") even though the leaf dirs were u0_a71 777 (the run-10
          # pristine-map-trees.txt shows both states side by side). Fix the
          # whole created chain from files/ down (idempotent; the leaves are
          # included; || true keeps a missing segment non-fatal).
          adb -s localhost:5555 shell "chown -R $UP:$UP '/storage/emulated/0/Android/data/$PKG/files/Download' '/storage/emulated/0/Android/data/$PKG/files/SandboxOL' '/storage/emulated/0/Android/data/$PKG/files/SandBoxOL'" || true
          adb -s localhost:5555 shell "chmod -R 777 '/storage/emulated/0/Android/data/$PKG/files/Download' '/storage/emulated/0/Android/data/$PKG/files/SandboxOL' '/storage/emulated/0/Android/data/$PKG/files/SandBoxOL'" || true
          # RUN-15 DECODE: the hall-card join NEVER calls the Java res chain
          # (k.smali/getGameResource is the party-join path) — the engine's
          # client resources (g1008_boy.actor et al, absent from the APK's
          # own assets/resources/Media/Actor/) arrive via the NATIVE
          # engine's resUrl flow (d401m01aifavw.cloudfront.net — the
          # startParameter's resUrl), whose cache is the app's
          # getDir("resourcesv2") = /data/user/0/<pkg>/app_resourcesv2/.
          # Pre-place the official appres-g1046-10078 package there
          # (Scripts/ + appres/ + checksums.md5 at the root, the same
          # structure the native downloader would install) so the engine
          # finds its actors without any res fetch.
          curl -sS -o /tmp/appres-g1046.zip \
            "https://staticgs.sandboxol.com/sandbox/games/app-game-engine-resources/appres-g1046-10078.1625198960711.zip"
          echo "a9b2dd94151f72b39e24d278889ca35d63a64c005c4841a8eac7f60ac4752677  /tmp/appres-g1046.zip" | sha256sum -c -
          rm -rf /tmp/appresx && mkdir -p /tmp/appresx
          (cd /tmp/appresx && unzip -q /tmp/appres-g1046.zip)
          RES="/data/user/0/$PKG/app_resourcesv2"
          adb -s localhost:5555 shell "mkdir -p '$RES'"
          adb -s localhost:5555 push /tmp/appresx/. "$RES/"
          adb -s localhost:5555 shell "chown -R $UP:$UP '$RES'" || true
          adb -s localhost:5555 shell "chmod -R 777 '$RES'" || true
          echo "== placed res cache =="
          adb -s localhost:5555 shell "ls '$RES' | head -5; ls '$RES/Scripts/Game/g1008/res/actor' 2>/dev/null | head -4"
          # RUN-20 DECODE (38518243375): the SKYBLOCK room crashed the
          # engine at the room entry — the client.log spammed "boneCount
          # too large: 1634956133" (0x61737365 = "asse" — a garbage file
          # parsed as a skeleton) right after "recv user attr info" and
          # the tombstone followed; ClientPeer::rebirth re-crashed in a
          # loop. THE DECODE: the m1048_1 map's config.yml references
          # dozens of g1048_*.actor ITEM actors (fountains etc.) that
          # exist NOWHERE in the placed tree (the CDN's only 10078 appres
          # is the g1046 hall one) — the engine's fallback parsed garbage.
          # THE CDN HAS THE G1048 APPRES after all (the urls_cdn_ms.txt
          # composite naming hid it: appres-g1048-10076 — engine 10076,
          # two versions before 10078; the same 1007x family): 662
          # g1048-only files (Scripts/Game/g1048 actors + Sound +
          # appres/g1048.json), ZERO overlap with the g1046-10078 package
          # except checksums.md5 — a clean overlay merge.
          curl -sS -o /tmp/appres-g1048.zip \
            "https://staticgs.sandboxol.com/sandbox/games/app-game-engine-resources/appres-g1048-10076.1622266820645.zip"
          echo "ed1d198405ed29371f5f6df4f01f27c48c1f1780ec15ec6c58f66973e69c9f05  /tmp/appres-g1048.zip" | sha256sum -c -
          rm -rf /tmp/appres1048x && mkdir -p /tmp/appres1048x
          (cd /tmp/appres1048x && unzip -q /tmp/appres-g1048.zip)
          # Overlay WITHOUT the g1048 checksums.md5 (the root file stays
          # the g1046 one; a merged union is pushed below).
          rm /tmp/appres1048x/checksums.md5
          adb -s localhost:5555 push /tmp/appres1048x/. "$RES/"
          # The merged checksums.md5: the g1046 entries + every g1048
          # path (union by path; the only conflicting path is the
          # checksums file itself — dropped from the g1048 side).
          python3 - <<'PYEOF'
          import zipfile
          def entries(p):
              out = {}
              for line in zipfile.ZipFile(p).read('checksums.md5').decode('utf-8', 'replace').splitlines():
                  line = line.strip()
                  if not line or '*' not in line:
                      continue
                  h, path = line.split('*', 1)
                  out[path.strip()] = h.strip()
              return out
          m = entries('/tmp/appres-g1046.zip')
          m.update(entries('/tmp/appres-g1048.zip'))
          with open('/tmp/checksums_merged.md5', 'w') as f:
              for path in sorted(m):
                  f.write('%s *%s\n' % (m[path], path))
          print('merged checksums entries:', len(m))
          PYEOF
          adb -s localhost:5555 push /tmp/checksums_merged.md5 "$RES/checksums.md5"
          adb -s localhost:5555 shell "chown -R $UP:$UP '$RES'" || true
          adb -s localhost:5555 shell "chmod -R 777 '$RES'" || true
          echo "== g1048 actors now placed =="
          adb -s localhost:5555 shell "ls '$RES/Scripts/Game/g1048/res/actor' 2>/dev/null | head -6; ls '$RES/Scripts/Game' 2>/dev/null"
          # RUN-22 DECODE (38524560805): the placed actor was NEVER found —
          # 'sub Actor file not found [g1008_boy.actor]' at the avatar load
          # in EVERY boot that reached it (the g1048 boots of runs 16/20/22;
          # the old 'the actor is fixed' note was a misread of run 16).
          # PROOF the engine never searches app_resourcesv2: the placed
          # g1048_striation.effect (inside the pushed g1048 appres) still
          # logged 'Effect file isn't exist', while reddot.effect (a MAP
          # file) was FOUND — the search roots are the APK assets +
          # app_resources/ + the map dir, NOT the v2 cache. The engine's
          # resource ids are 'Media/'-prefixed (the lib's Setting literals
          # are 'Media/Setting/ItemGun.csv' etc.; the APK's own actors live
          # at assets/resources/Media/Scripts/Game/g1008/res/actor/ —
          # INCLUDING g1008_boy/girl.actor, the delta-32 claim was wrong).
          # FIX: mirror the appres trees under app_resources/Media/ (the
          # rootPath's Media subtree) so the engine's ids resolve from the
          # filesystem the same way they resolve from the APK.
          MEDIA="/data/user/0/$PKG/app_resources/Media"
          adb -s localhost:5555 shell "mkdir -p '$MEDIA'"
          adb -s localhost:5555 push /tmp/appresx/. "$MEDIA/"
          adb -s localhost:5555 push /tmp/appres1048x/. "$MEDIA/"
          adb -s localhost:5555 push /tmp/checksums_merged.md5 "$MEDIA/checksums.md5"
          adb -s localhost:5555 shell "chown -R $UP:$UP '/data/user/0/$PKG/app_resources'" || true
          adb -s localhost:5555 shell "chmod -R 777 '/data/user/0/$PKG/app_resources'" || true
          echo "== Media actors now placed =="
          adb -s localhost:5555 shell "ls '$MEDIA/Scripts/Game/g1008/res/actor' 2>/dev/null | head -8; ls '$MEDIA/Scripts/Game' 2>/dev/null"
          # RUN-23 DECODE (38530968032 — the FIRST fully-green VERDICT run,
          # but honest-evidence review shows both boots still crashed ~1 s
          # after 'sub Actor file not found [g1008_boy.actor]' (two fresh
          # tombstones, SIGSEGV MainTickThread): the green watches read the
          # logcat HISTORY (fired/srvLogin/userIn are ever-seen flags).
          # The template system: the avatar template is Media/Actor/boy.actor
          # (BARE name, shipped in the APK) — the EntityRenderPlayer strings
          # ('boy.actor'/'girl.actor' beside '%s/%s'); the template
          # references SUB-ACTOR files (g1008_boy.actor) that resolve in the
          # TEMPLATE's dir (Media/Actor/) — absent there in every run (the
          # APK ships boy.actor but NOT g1008_boy.actor in Media/Actor/).
          # FIX: copy the g1008 avatar actor set into $MEDIA/Actor/ too.
          adb -s localhost:5555 shell "mkdir -p '$MEDIA/Actor'"
          for A in g1008_boy.actor g1008_girl.actor g1008_skin.actor g1008_skin2.actor; do
            adb -s localhost:5555 shell "cp '$MEDIA/Scripts/Game/g1008/res/actor/$A' '$MEDIA/Actor/$A' 2>/dev/null" || true
          done
          adb -s localhost:5555 shell "chown -R $UP:$UP '$MEDIA/Actor'" || true
          adb -s localhost:5555 shell "chmod -R 777 '$MEDIA/Actor'" || true
          echo "== Media/Actor avatar set =="
          adb -s localhost:5555 shell "ls '$MEDIA/Actor' | head -8"
          echo "== placed map trees =="
          adb -s localhost:5555 shell "find /storage/emulated/0/Android/data/$PKG/files/Download/SandboxOL/BlockMan -maxdepth 4 | head -20"
          # RUN-32 DECODE (38624695619): the Skyblock boot died at 3 s
          # uptime (SIGSEGV MainTickThread, pc libBlockMan.so+0x88e970,
          # fault 0x0) right after "GUIWindowManager::LoadWindowFromJSON:
          # SkyBlockMain.json not exist!" — the pristine 2.8.2 APK ships
          # ZERO SkyBlock* UI windows (verified: assets grep = 0 hits;
          # the 4151-era harness base ships 23 SkyBlock* UI jsons; the
          # 2.8.2 predates the SkyBlock UI). The g1048 appres zip does NOT
          # carry them either (only Scripts/Sound/appres). The null main
          # window = the crash. The same-boot Bedwars tolerated the
          # g1048_striation.effect + g1008_boy.actor misses (alive through
          # the whole watch) = ONLY the missing main UI window = fatal.
          # FIX: place the 4151-era SkyBlock UI json set from the harness
          # base APK into the pristine's app_resources/Media/GUI/UI/ (the
          # rootPath Media subtree = the run-22-decoded search root).
          rm -rf /tmp/sbui && mkdir -p /tmp/sbui/out
          unzip -o -q harness.apk 'assets/resources/Media/GUI/UI/SkyBlock*' -d /tmp/sbui
          cp /tmp/sbui/assets/resources/Media/GUI/UI/SkyBlock*.json /tmp/sbui/out/
          echo "SkyBlock UI files extracted: $(ls /tmp/sbui/out | wc -l)"
          [ "$(ls /tmp/sbui/out | wc -l)" -ge 20 ] || { echo "SkyBlock UI extraction incomplete"; exit 1; }
          adb -s localhost:5555 shell "mkdir -p '$MEDIA/GUI/UI'"
          adb -s localhost:5555 push /tmp/sbui/out/. "$MEDIA/GUI/UI/"
          adb -s localhost:5555 shell "chown -R $UP:$UP '$MEDIA/GUI'" || true
          adb -s localhost:5555 shell "chmod -R 777 '$MEDIA/GUI'" || true
          echo "== SkyBlock UI placed =="
          adb -s localhost:5555 shell "ls '$MEDIA/GUI/UI' | head -5; ls '$MEDIA/GUI/UI' | wc -l"

      - name: Launch the pristine client (drive step 1 - login lands on OUR holder)
        run: |
          adb -s localhost:5555 logcat -c
          adb -s localhost:5555 shell am start -n "$PRISTINE_PKG/$PRISTINE_ACT"
          sleep 20
          if ! adb -s localhost:5555 shell pidof "$PRISTINE_PKG" | grep -qE '[0-9]'; then
            echo "PRISTINE CLIENT DIED within 20s (TSS must NOT fire on the official APK — capture everything)"
            adb -s localhost:5555 logcat -d | tail -200
            exit 1
          fi
          echo "pristine alive: $(adb -s localhost:5555 shell pidof "$PRISTINE_PKG")"
          echo "== the holder saw the client's auth traffic =="
          adb -s localhost:5555 logcat -d -s LocalAPI:* | grep -E "REQ " | tail -20 || true
          adb -s localhost:5555 exec-out screencap -p > pristine-boot.png || true

      - name: THE DRIVE — per-game joins (ON_DEVICE_DRIVE §6)
        # One automation run per game spec "card_regex::label". Each run:
        # attach (idempotent) -> hall -> find the card -> detail ->
        # btn_enter -> the drive verdict chain (auth -> dispatch -> engine
        # -> C2S login -> g2r). The loop continues on a game's failure so
        # one red game never hides the others' evidence; the artifacts +
        # the per-run exit lines are the report.
        # WATCH_SECONDS=600 (run-6 lesson): the hall boots the engine world
        # LOCALLY (isDelayConnect: 1) and only then downloads the map from
        # the holder's MapAssets and joins rooms via the engine's inner
        # API — the old 300 s window starved that chain.
        env:
          WATCH_SECONDS: '600'
        run: |
          rc_total=0
          IFS=',' read -ra SPECS <<< "$GAMES"
          for SPEC in "${SPECS[@]}"; do
            [ -z "$SPEC" ] && continue
            RE="${SPEC%%::*}"
            LABEL="${SPEC#*::}"
            [ "$LABEL" = "$RE" ] && LABEL="$RE"
            echo "===== DRIVE GAME: label='$LABEL' regex='$RE' ====="
            set +e
            # CAPTURE-TIMING FIX (run-19 docs order): the logdir sweep runs
            # BEFORE the watch too (the automation stashes pre/mid/post
            # itself) — the pre- state pins what the engine had on disk
            # before this join touches it.
            adb -s localhost:5555 shell "sh /sdcard/drive/ondrive_collect.sh pre-$(echo "$LABEL" | tr -c 'A-Za-z0-9' '-')" || true
            python3 scripts/ui_automation_test.py \
              --serial localhost:5555 \
              --package "$PRISTINE_PKG" \
              --activity "$PRISTINE_ACT" \
              --line 282 --drive \
              --card-regex "$RE" --game-label "$LABEL"
            rc=$?
            set -e
            echo "===== DRIVE RESULT: $LABEL rc=$rc ====="
            [ $rc -ne 0 ] && rc_total=1
            adb -s localhost:5555 shell "sh /sdcard/drive/ondrive_collect.sh game-$(echo "$LABEL" | tr -c 'A-Za-z0-9' '-')" || true
          done
          exit $rc_total

      - name: Evidence harvest (the §6 collector + the engine-side probe)
        if: always()
        run: |
          adb -s localhost:5555 shell "sh /sdcard/drive/ondrive_collect.sh final" || true
          mkdir -p gjevidence
          # the rebuilt pristine's identity (the run-33-postmortem step)
          cp -f evidence-pristine-build.md5 gjevidence/ 2>/dev/null || true
          # RUN-29 POSTMORTEM: which libgameserver binary did this run
          # actually stage? The md5 names the build-gameserver run.
          adb -s localhost:5555 shell "find /data/data/com.disabngo.blockynexus /data/app -name 'libgameserver*' 2>/dev/null" | tr -d '\r' | while read -r f; do
            [ -n "$f" ] || continue
            echo "== $f"
            adb -s localhost:5555 shell "md5sum '$f' 2>/dev/null; ls -la '$f' 2>/dev/null" | tr -d '\r'
          done | tee gjevidence/lib-md5.txt || true
          adb -s localhost:5556 shell "find /data -name 'libgameserver*' 2>/dev/null" >> gjevidence/lib-md5.txt 2>/dev/null || true
          # RUN-30 POSTMORTEM: the 4fee856 edit switched this ls to -la,
          # whose permission-prefixed lines NEVER match `evidence-*` - the
          # run-30 tarball shipped without a single log. Bare ls = back.
          adb -s localhost:5555 shell "ls /sdcard/drive/" | tr -d '\r' | while read -r f; do
            case "$f" in evidence-*)
              adb -s localhost:5555 pull "/sdcard/drive/$f" gjevidence/ 2>/dev/null || true ;;
            esac
          done
          PKG="$PRISTINE_PKG"
          echo "== pristine config/log dirs =="
          adb -s localhost:5555 shell "find /storage/emulated/0 -maxdepth 6 \( -iname '*sandboxol*' -o -iname '*blockman*' \) 2>/dev/null" | head -40 || true
          echo "== every *.log under those trees =="
          adb -s localhost:5555 shell "find /storage/emulated/0 /data/data/$PKG/files /data/media/0 -maxdepth 7 -name '*.log' 2>/dev/null | head -30" || true
          echo "== LocalAPI REQ/RES tail (the holder's view of the join) =="
          adb -s localhost:5555 logcat -d -s LocalAPI:* | grep -E "REQ (GET /game/api/v2/game/auth|POST /v1/dispatch|POST /game|GET /game/api/v2/game/data)|gs: |monitor" | tail -40 || true
          echo "== the engine's map download (ASSET lines) + inner requests =="
          adb -s localhost:5555 logcat -d -s LocalAPI:* | grep -E "ASSET |REQ POST /|game-map|gs-inner" | tail -30 || true
          echo "== the client's Download/map staging trees =="
          adb -s localhost:5555 shell "find /storage/emulated/0/Android/data/$PKG/files/Download -maxdepth 6 2>/dev/null | head -30" || true
          adb -s localhost:5555 shell "ls -la /storage/emulated/0/Android/data/$PKG/files/Download/SandboxOL/BlockMan/map 2>/dev/null" || true
          echo "== FATAL scan =="
          adb -s localhost:5555 logcat -d | grep -E "FATAL EXCEPTION|fatal signal" | head -10 || echo "no fatals"
          ls -la gjevidence/ || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-pristine-drive
          path: |
            harness-boot.png
            pristine-boot.png
            gjevidence/
            /tmp/holder_probe.json
          if-no-files-found: ignore

      - name: Attach evidence to the release (the cron PAT cannot download the action artifacts)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAR="gjevidence-run-${{ github.run_id }}.tar.gz"
          tar -czf "$TAR" gjevidence/ harness-boot.png pristine-boot.png /tmp/holder_probe.json 2>/dev/null || tar -czf "$TAR" gjevidence/ || true
          ls -la "$TAR" || true
          gh release upload wip-sandbox86 "$TAR" --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create wip-sandbox86 "$TAR" --title "BlockyNexus localapi wip-sandbox86" --notes "drive evidence" --repo "$GITHUB_REPOSITORY" \
            || echo "release attach failed (non-fatal)"
