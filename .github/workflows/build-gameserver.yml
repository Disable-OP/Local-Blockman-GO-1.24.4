name: build-gameserver
# Cross-compiles the C++ GameServer (engine LordCore -> Logic -> gameserver)
# for Android arm64 and attaches the binary to the localapi-assets release.
#
# SPEED: the tree has ~550 TUs, several of which peak ~3.5GB RAM each, so the
# build is capped at -j2 (16GB runner) and a cold build takes ~90 min. Every
# compile is wrapped in ccache (NDK_CCACHE), so after one cold run each
# "fix one TU + relink" iteration only recompiles what changed (~15-20 min).
# The NDK toolchain install is cached too (~3 min saved per run).

on:
  workflow_dispatch:
  push:
    branches: ain]
    paths:
      - "scripts/gameserver/**"

permissions:
  contents: write

concurrency:
  group: build-gameserver
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore NDK r17c cache
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /opt/android-ndk-r17c
          key: ndk-r17c-linux-x86_64

      - name: Install NDK r17c (gcc 4.9 + gnustl — era-matched toolchain)
        run: |
          if [ -d /opt/android-ndk-r17c ]; then
            echo "NDK cache hit — skipping download"
          else
            cd /opt
            wget -q https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip
            unzip -q android-ndk-r17c-linux-x86_64.zip
            rm android-ndk-r17c-linux-x86_64.zip
          fi
          echo "NDK=/opt/android-ndk-r17c" >> "$GITHUB_ENV"
          # engine code carries printf-style log warnings; the NDK default
          # -Werror=format-security turns them fatal — downgrade (matches the
          # sandbox build config). Idempotent.
          sed -i 's/-Werror=format-security/-Wno-error=format-security/g' \
            /opt/android-ndk-r17c/build/core/default-build-commands.mk

      - name: Install ccache
        run: |
          sudo apt-get install -y ccache >/dev/null 2>&1 || true
          ccache --version | head -1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-gs-${{ github.run_id }}
          restore-keys: |
            ccache-gs-

      - name: Configure ccache
        run: |
          ccache -M 6G
          ccache -o compression=true
          ccache -o compiler_check=mtime
          ccache -s | head -5

      - name: Assemble sources from archives
        run: |
          pip install --quiet py7zr
          bash scripts/gameserver/assemble_sources.sh "$GITHUB_WORKSPACE/gswork"

      - name: Patch sources
        run: python3 scripts/gameserver/patch_sources.py "$GITHUB_WORKSPACE/gswork"

      - name: ndk-build gameserver (arm64-v8a)
        working-directory: ${{ github.workspace }}/scripts/gameserver
        env:
          GS_WORK: ${{ github.workspace }}/gswork
          NDK_CCACHE: ccache
          CCACHE_MAXSIZE: 6G
        run: |
          set -o pipefail
          # -j2: giant template TUs peak ~3.5GB each; -j4 OOM-kills even 16GB
          # runners. ccache makes warm iterations fast at any -j.
          "$NDK/ndk-build" -j2 NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            GS_WORK="$GS_WORK" > build.log 2>&1 || true
          tail -40 build.log
          # ndk-build installs BUILD_EXECUTABLE modules WITHOUT the .so
          # suffix (LOCAL_MODULE_FILENAME is used verbatim -> "libgameserver").
          # Normalize to the canonical libgameserver.so name that the sanity
          # step, the release asset, and the APK jniLib injection all expect.
          B=libs/arm64-v8a/libgameserver
          [ -f "$B" ] || B=libs/arm64-v8a/libgameserver.so
          test -f "$B" || { dmesg 2>/dev/null | tail -5 || true; exit 1; }
          file "$B"
          ls -la "$B"
          cp -f "$B" libs/arm64-v8a/libgameserver.so

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndk-build-log
          path: scripts/gameserver/build.log
          retention-days: 7

      - name: Static sanity checks on the binary
        run: |
          B=$GITHUB_WORKSPACE/scripts/gameserver/libs/arm64-v8a/libgameserver.so
          file "$B" | grep -q 'aarch64'
          # required dynamic symbols / entry
          readelf -h "$B" | grep -q 'AArch64'
          readelf -d "$B" | grep NEEDED | head -10
          strings -a "$B" | grep -q 'pq0194mxoqfh48L362G6R09T737E273X' && echo "secret embedded OK"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B=$GITHUB_WORKSPACE/scripts/gameserver/libs/arm64-v8a/libgameserver.so
          cp "$B" ./libgameserver-arm64.so
          gh release upload localapi-assets libgameserver-arm64.so --clobber || {
            gh release create localapi-assets libgameserver-arm64.so --title "localapi assets" --notes "assets" --prerelease;
          }
          echo "uploaded libgameserver-arm64.so"
