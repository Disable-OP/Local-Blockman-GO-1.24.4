name: test-redroid-deep
# MANUAL deep-drive validation run (--mode full) — now TIME-BUDGETED.
# User mandate 2026-10-08 ("lower the DEEP test redroid time ... I am sick
# of always waiting 30-35 minutes ... TIME IS PRECIOUS"): the deep suite
# runs under a deep-phase budget (--deep-budget-min, default 5). Expected
# wall with the default budget: ~12-14 min total
#   (infra ~4 min + fast core ~4 min + deep phases <=5 min + diagnostics ~1 min).
# The deep-phase budget is enforced INSIDE scripts/ui_automation_test.py:
#   - deep-drive A / Phase B  -> non-raising gates before the core chain
#   - Phase E .. LM           -> DeepBudgetSkip, caught gracefully
# Over-budget deep phases are SKIPPED ([skip budget] lines in the log); the
# run stays green, the final assertions + crash scan + coverage report still
# execute, and diagnostics are always uploaded.
#
# The fast workflow (test-redroid.yml) stays FAST-ONLY (~5 min wall) per the
# user mandate 2026-10-07 and is untouched.
#
# Need the LEGACY full audit (~25-35 min, every deep phase)? Dispatch with
# deep_budget_min = 0 (unlimited). The suite's own budget is the wall; the
# job/step timeouts below scale accordingly.
#
# Fleet run 37746581644 lesson (budget 15): a flat 12-min STEP timeout
# killed the run mid-Phase-F before G..N could execute. Budgets > 5 are
# deliberate verdict-harvest dispatches, so their backstops scale:
#   budget 0  -> job 45 / step 40 (legacy unlimited)
#   budget >5 -> job 40 / step 32 (fleet harvest, deep ~15 min + core ~11)
#   else      -> job 18 / step 12 (the ~10-min default fleet-mandated run)

on:
  workflow_dispatch:
    inputs:
      deep_budget_min:
        description: 'Minutes for deep phases (0 = legacy unlimited full suite)'
        default: '5'
        required: false

permissions:
  contents: read

jobs:
  redroid-deep-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ fromJSON(inputs.deep_budget_min || '5') == 0 && 45 || (fromJSON(inputs.deep_budget_min || '5') > 5 && 40 || 18) }}
    env:
      PACKAGE: com.disabngo.blockynexus
      ACTIVITY: com.disabngo.blockynexus.view.activity.start.StartActivity
    steps:
      - uses: actions/checkout@v4
        with:
          ref: local-api

      - name: Fetch latest patched APK from releases (prerelease-aware)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_release_asset.py BlockyNexus-localapi.apk app.apk

      - name: Load binder kernel module
        run: |
          if ! sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null; then
            echo "modprobe failed - installing kernel modules + adb"
            sudo apt-get update -qq
            sudo apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb
            sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          fi
          command -v adb >/dev/null 2>&1 || { sudo apt-get update -qq; sudo apt-get install -y -qq android-tools-adb; }
          adb version | head -1

      - name: Start Redroid (arm64 native, Android 12)
        run: |
          docker run -d --name redroid --privileged -p 5555:5555 \
            redroid/redroid:12.0.0-latest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320 \
            androidboot.redroid_gpu_mode=guest
          adb connect localhost:5555

      - name: Wait for Android boot
        run: |
          for i in $(seq 1 48); do
            b=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$b" = "1" ] && echo "boot completed" && exit 0
            echo "waiting for boot ($i/48)"; sleep 5
          done
          echo "DEVICE FAILED TO BOOT"; exit 1

      - name: Install APK
        run: |
          adb -s localhost:5555 install -r -t app.apk

      - name: Launch + 10s keep-alive check
        run: |
          adb -s localhost:5555 logcat -c
          adb -s localhost:5555 shell am start -n "$PACKAGE/$ACTIVITY"
          sleep 10
          if adb -s localhost:5555 shell pidof "$PACKAGE" | grep -qE '[0-9]'; then
            echo "APP ALIVE after 10s"
            adb -s localhost:5555 shell pidof "$PACKAGE"
          else
            echo "APP PROCESS DIED within 10s"
            adb -s localhost:5555 logcat -d | tail -100
            exit 1
          fi

      - name: Run UI automation suite (budgeted deep-drive mode)
        # Deep-phase budget enforced inside the suite itself; this step
        # timeout is the backstop. run 37739443414 lesson: the CORE Phase A
        # (visitor + tabs + deep-drive A) alone needs ~7 min on the
        # guest-GPU emulator, so a 9-min backstop killed a healthy run.
        # Budgeted runs get 12 min; fleet harvest (input > 5) gets 32 —
        # run 37746581644 died at the flat 12 min mid-Phase-F with budget
        # 15, before the G..N phases ever started. Legacy unlimited (0)
        # keeps 40.
        timeout-minutes: ${{ fromJSON(inputs.deep_budget_min || '5') == 0 && 40 || (fromJSON(inputs.deep_budget_min || '5') > 5 && 32 || 12) }}
        run: |
          python3 scripts/ui_automation_test.py \
            --serial localhost:5555 \
            --package "$PACKAGE" \
            --activity "$ACTIVITY" \
            --mode full \
            --deep-budget-min "${{ inputs.deep_budget_min || '5' }}"

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p diags
          adb -s localhost:5555 logcat -d > diags/logcat.txt || true
          adb -s localhost:5555 logcat -d -b crash > diags/crash.txt || true
          adb -s localhost:5555 logcat -d -b events > diags/events.txt || true
          adb -s localhost:5555 logcat -d -b system > diags/system.txt || true
          adb -s localhost:5555 logcat -d -s LocalAPI > diags/localapi.txt || true
          adb -s localhost:5555 shell cat /proc/meminfo > diags/meminfo.txt || true
          adb -s localhost:5555 shell dumpsys meminfo > diags/meminfo-app.txt || true
          adb -s localhost:5555 shell uiautomator dump /sdcard/final_ui.xml >/dev/null 2>&1 || true
          adb -s localhost:5555 pull /sdcard/final_ui.xml diags/final_ui.xml || true
          adb -s localhost:5555 shell dumpsys activity processes > diags/processes.txt || true
          for f in $(adb -s localhost:5555 shell ls /sdcard/snap_*.png 2>/dev/null | tr -d '\r'); do
            adb -s localhost:5555 pull "$f" diags/ || true
          done
          tar czf redroid-deep-diagnostics.tgz diags || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-deep-diagnostics
          path: redroid-deep-diagnostics.tgz
          if-no-files-found: ignore
