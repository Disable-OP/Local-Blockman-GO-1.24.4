name: test-redroid-deep
# MANUAL deep-drive validation run (--mode full) — now TIME-BUDGETED.
# User mandate 2026-10-08 ("lower the DEEP test redroid time ... I am sick
# of always waiting 30-35 minutes ... TIME IS PRECIOUS"): the deep suite
# runs under a deep-phase budget (--deep-budget-min, default 5). Expected
# wall with the default budget: ~15-17 min total
#   (infra ~4 min + fast core ~4 min + deep phases <=5 min
#    + PHASE GJ ~2.5 min + diagnostics ~1 min).
# 2026-10-09: PHASE GJ (gameplay-join verification + screenshots at every
# phase boundary) runs in BOTH modes — see ui_automation_test.py.
# The deep-phase budget is enforced INSIDE scripts/ui_automation_test.py:
#   - deep-drive A / Phase B  -> non-raising gates before the core chain
#   - Phase E .. LM           -> DeepBudgetSkip, caught gracefully
# Over-budget deep phases are SKIPPED ([skip budget] lines in the log); the
# run stays green, the final assertions + crash scan + coverage report still
# execute, and diagnostics are always uploaded.
#
# The fast workflow (test-redroid.yml) stays FAST + GJ (~8 min wall) per
# the user mandate 2026-10-07 and the 2026-10-09 join-verification mandate.
#
# Need the LEGACY full audit (~25-35 min, every deep phase)? Dispatch with
# deep_budget_min = 0 (unlimited). The suite's own budget is the wall; the
# job/step timeouts below scale accordingly.
#
# Fleet run 37746581644 lesson (budget 15): a flat 12-min STEP timeout
# killed the run mid-Phase-F before G..N could execute. Budgets > 5 are
# deliberate verdict-harvest dispatches, so their backstops scale:
#   budget 0  -> job 45 / step 44 (legacy unlimited)
#   budget >5 -> job 45 / step 42 (fleet harvest; run 37751313202 passed
#                at 19 min with budget 15 — the bigger 25-min harvests
#                need the extra headroom to reach H..N/O/LM)
#   else      -> job 26 / step 20 (the ~18-min default run; GJ polls 300s)

on:
  workflow_dispatch:
    inputs:
      deep_budget_min:
        description: 'Minutes for deep phases (0 = legacy unlimited full suite)'
        default: '5'
        required: false

permissions:
  contents: read

jobs:
  redroid-deep-test:
    runs-on: ubuntu-24.04-arm
    # 2026-10-09: the default budgeted run grew by ~4 min (PHASE GJ, the
    # gameplay-join verification, now runs in BOTH modes) -> 18 -> 22.
    # Legacy unlimited (0) and fleet harvest (>5) keep 45.
    timeout-minutes: ${{ fromJSON(inputs.deep_budget_min || '5') == 0 && 45 || (fromJSON(inputs.deep_budget_min || '5') > 5 && 45 || 26) }}
    env:
      PACKAGE: com.disabngo.blockynexus
      ACTIVITY: com.disabngo.blockynexus.view.activity.start.StartActivity
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch latest patched APK from releases (prerelease-aware)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_release_asset.py BlockyNexus-localapi.apk app.apk

      - name: Load binder kernel module
        run: |
          if ! sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null; then
            echo "modprobe failed - installing kernel modules + adb"
            sudo apt-get update -qq
            sudo apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb
            sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          fi
          command -v adb >/dev/null 2>&1 || { sudo apt-get update -qq; sudo apt-get install -y -qq android-tools-adb; }
          adb version | head -1

      - name: Start Redroid (arm64 native, Android 12)
        run: |
          docker run -d --name redroid --privileged -p 5555:5555 \
            redroid/redroid:12.0.0-latest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320 \
            androidboot.redroid_gpu_mode=guest
          adb connect localhost:5555

      - name: Wait for Android boot
        run: |
          for i in $(seq 1 48); do
            b=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$b" = "1" ] && echo "boot completed" && exit 0
            echo "waiting for boot ($i/48)"; sleep 5
          done
          echo "DEVICE FAILED TO BOOT"; exit 1

      - name: Install APK
        run: |
          adb -s localhost:5555 install -r -t app.apk

      - name: Launch + 10s keep-alive check
        run: |
          adb -s localhost:5555 logcat -c
          adb -s localhost:5555 shell am start -n "$PACKAGE/$ACTIVITY"
          sleep 10
          if adb -s localhost:5555 shell pidof "$PACKAGE" | grep -qE '[0-9]'; then
            echo "APP ALIVE after 10s"
            adb -s localhost:5555 shell pidof "$PACKAGE"
          else
            echo "APP PROCESS DIED within 10s"
            adb -s localhost:5555 logcat -d | tail -100
            exit 1
          fi

      - name: Run UI automation suite (budgeted deep-drive mode)
        # Deep-phase budget enforced inside the suite itself; this step
        # timeout is the backstop. run 37739443414 lesson: the CORE Phase A
        # (visitor + tabs + deep-drive A) alone needs ~7 min on the
        # guest-GPU emulator, so a 9-min backstop killed a healthy run.
        # Budgeted runs get 16 min (2026-10-09: +4 min for PHASE GJ, the
        # gameplay-join verification now running in BOTH modes); fleet
        # harvest (input > 5) gets 42 — run 37746581644 died at a flat
        # 12 min mid-Phase-F with budget 15 (before G..N ever started),
        # and run 37751313202 passed at 19 min with budget 15; the bigger
        # harvests need the headroom. Legacy unlimited (0) keeps 44.
        timeout-minutes: ${{ fromJSON(inputs.deep_budget_min || '5') == 0 && 44 || (fromJSON(inputs.deep_budget_min || '5') > 5 && 45 || 20) }}
        run: |
          python3 scripts/ui_automation_test.py \
            --serial localhost:5555 \
            --package "$PACKAGE" \
            --activity "$ACTIVITY" \
            --mode full \
            --deep-budget-min "${{ inputs.deep_budget_min || '5' }}"

      - name: GameServer smoke (process + RakNet listen + engine logs)
        # 2026-10-09: the deep workflow previously had NO gameserver smoke
        # step at all — the fast workflow owned it. With PHASE GJ now
        # joining a real room in deep mode too, the smoke verdict (RakNet
        # listener, client.log + server.log tails) belongs here as well.
        if: always()
        run: |
          echo "== gameserver process =="
          adb -s localhost:5555 shell "ps -A | grep -i gameserver" || true
          echo "== RakNet 31108 listen probe (/proc/net/udp, 31108=0x7994) =="
          adb -s localhost:5555 shell "cat /proc/net/udp" 2>/dev/null | grep -i '7994' || echo "no :7994 UDP socket visible to shell"
          echo "== localapi boot logs (gs tags) =="
          adb -s localhost:5555 logcat -d -s LocalAPI:* GS:* | grep -iE "gs:|gameserver|monitor|g2r|dispatch" | tail -40 || true
          LOGDIR=$(adb -s localhost:5555 shell 'ls -d /storage/emulated/*/SandBoxOL/BlockMan/config 2>/dev/null' | tr -d '\r' | head -1)
          if [ -z "$LOGDIR" ]; then
            LOGDIR=$(adb -s localhost:5555 shell "run-as $PACKAGE sh -c 'ls -d /storage/emulated/*/SandBoxOL/BlockMan/config 2>/dev/null'" | tr -d '\r' | head -1)
          fi
          if [ -z "$LOGDIR" ]; then
            LOGDIR=$(adb -s localhost:5555 shell "ls -d /storage/emulated/*/Android/data/$PACKAGE/files/SandBoxOL/config 2>/dev/null" | tr -d '\r' | head -1)
          fi
          echo "resolved config dir: ${LOGDIR:-<none>}"
          echo "== storage visibility diag (shell view) =="
          adb -s localhost:5555 shell "ls /storage/emulated/ 2>&1 | head -4" || true
          adb -s localhost:5555 shell "ls /storage/emulated/0/ 2>&1 | head -12" || true
          if [ -n "$LOGDIR" ]; then
            adb -s localhost:5555 shell "ls -la $LOGDIR" || true
            CLOG=$(adb -s localhost:5555 shell "tail -c 8192 $LOGDIR/client.log 2>/dev/null" | tr -d '\r')
            if [ -n "$CLOG" ]; then
              echo "== client.log tail (CLIENT ENGINE words) =="
              echo "$CLOG"
            else
              CLOG=$(adb -s localhost:5555 shell "run-as $PACKAGE tail -c 8192 $LOGDIR/client.log 2>/dev/null" | tr -d '\r')
              if [ -n "$CLOG" ]; then
                echo "== client.log tail (via run-as; shell view is storage-blind) =="
                echo "$CLOG"
              else
                echo "client.log not yet present"
              fi
            fi
            SLOG=$(adb -s localhost:5555 shell "tail -c 8192 $LOGDIR/server.log 2>/dev/null" | tr -d '\r')
            if [ -n "$SLOG" ]; then
              echo "== server.log tail (GAMESERVER words) =="
              echo "$SLOG"
            else
              SLOG=$(adb -s localhost:5555 shell "run-as $PACKAGE tail -c 8192 $LOGDIR/server.log 2>/dev/null" | tr -d '\r')
              if [ -n "$SLOG" ]; then
                echo "== server.log tail (via run-as) =="
                echo "$SLOG"
              else
                echo "server.log not yet present (gameplay server may not have started)"
              fi
            fi
          else
            echo "SandBoxOL/BlockMan/config not found on this device"
          fi

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p diags
          adb -s localhost:5555 logcat -d > diags/logcat.txt || true
          adb -s localhost:5555 logcat -d -b crash > diags/crash.txt || true
          adb -s localhost:5555 logcat -d -b events > diags/events.txt || true
          adb -s localhost:5555 logcat -d -b system > diags/system.txt || true
          adb -s localhost:5555 logcat -d -s LocalAPI > diags/localapi.txt || true
          adb -s localhost:5555 shell cat /proc/meminfo > diags/meminfo.txt || true
          adb -s localhost:5555 shell dumpsys meminfo > diags/meminfo-app.txt || true
          adb -s localhost:5555 shell uiautomator dump /sdcard/final_ui.xml >/dev/null 2>&1 || true
          adb -s localhost:5555 pull /sdcard/final_ui.xml diags/final_ui.xml || true
          adb -s localhost:5555 shell dumpsys activity processes > diags/processes.txt || true
          # engine logs: client.log (the client's own log) + server.log —
          # resolved across ALL storage profiles (2026-10-09: the user's
          # profile is /storage/emulated/0/...; redroid may differ)
          for LOGDIR in $(adb -s localhost:5555 shell 'ls -d /storage/emulated/*/SandBoxOL/BlockMan/config 2>/dev/null' | tr -d '\r'); do
            echo "pulling engine logs from $LOGDIR"
            adb -s localhost:5555 pull "$LOGDIR/client.log" diags/client.log 2>/dev/null               || adb -s localhost:5555 shell "run-as $PACKAGE cat $LOGDIR/client.log 2>/dev/null" > diags/client.log || true
            adb -s localhost:5555 pull "$LOGDIR/server.log" diags/server.log 2>/dev/null               || adb -s localhost:5555 shell "run-as $PACKAGE cat $LOGDIR/server.log 2>/dev/null" > diags/server.log || true
            adb -s localhost:5555 shell "ls -la $LOGDIR" > diags/config-dir-listing.txt 2>&1 || true
          done
          # SCREENSHOTS from every phase boundary + checkpoint (2026-10-09
          # mandate) and assertion-miss snaps (e.g. snap_H_reward_dialog_missing)
          for f in $(adb -s localhost:5555 shell ls /sdcard/snap_*.png 2>/dev/null | tr -d '\r'); do
            adb -s localhost:5555 pull "$f" diags/ || true
          done
          tar czf redroid-deep-diagnostics.tgz diags || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-deep-diagnostics
          path: redroid-deep-diagnostics.tgz
          if-no-files-found: ignore
