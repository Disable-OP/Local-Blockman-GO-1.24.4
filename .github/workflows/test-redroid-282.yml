name: test-redroid-282
# Smoke test for the 2.8.2 (blockymods, engine 10078) line.
# Verifies the OFFICIAL-client boot chain against the embedded LocalAPI:
#   install -> launch -> process alive -> 18080 holder answers ->
#   gs staging logs appear -> no FATAL crash in the window.
# The full 9.4k-line UI suite is 1.24.4-specific (package-hardcoded);
# this workflow is the 2.8.2 equivalent of phase A + the gs boot.
# APK source: release asset "BlockyNexus-localapi-282.apk" (localapi-assets).

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["build-release"]
    types: [completed]

permissions:
  contents: read

jobs:
  redroid-smoke-282:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      PACKAGE: com.sandboxol.blockymods
      ACTIVITY: com.sandboxol.blockymods.view.activity.host.HostActivity
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch the 2.8.2 APK from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_release_asset.py BlockyNexus-localapi-282.apk app282.apk

      - name: Load binder kernel module
        run: |
          if ! sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb
            sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          fi
          command -v adb >/dev/null 2>&1 || { sudo apt-get update -qq; sudo apt-get install -y -qq android-tools-adb; }
          adb version | head -1

      - name: Start Redroid (arm64 native, Android 12)
        run: |
          docker run -d --name redroid --privileged -p 5555:5555 \
            redroid/redroid:12.0.0-latest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320 \
            androidboot.redroid_gpu_mode=guest
          adb connect localhost:5555

      - name: Wait for Android boot
        run: |
          for i in $(seq 1 48); do
            b=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$b" = "1" ] && echo "boot completed" && exit 0
            echo "waiting for boot ($i/48)"; sleep 5
          done
          echo "DEVICE FAILED TO BOOT"; exit 1

      - name: Install 2.8.2 APK
        run: |
          adb -s localhost:5555 install -r -t -g app282.apk
          # scoped-storage fix: targetSdk 29 on Android 11+ gets scoped
          # storage — /storage/emulated/0/SandBoxOL mkdirs fail (first smoke:
          # "placeMap: mkdirs failed"). LEGACY_STORAGE via appops restores
          # the legacy view the engine's PathUtil expects; the -g grant plus
          # this are both belt and braces.
          adb -s localhost:5555 shell appops set "$PACKAGE" LEGACY_STORAGE allow || true
          adb -s localhost:5555 shell appops set "$PACKAGE" MANAGE_EXTERNAL_STORAGE allow || true
          adb -s localhost:5555 shell pm grant "$PACKAGE" android.permission.WRITE_EXTERNAL_STORAGE 2>/dev/null || true
          adb -s localhost:5555 shell appops get "$PACKAGE" | grep -iE "LEGACY|MANAGE" || true

      - name: Engine exithook (seccomp wrap for the TSS exit(25) verdict)
        # libBlockMan.so (engine 10078) embeds the Tencent TSS native
        # (packed, zero imports). On the re-signed APK the verdict fires
        # during engine init and :BlockmanGo exits CLEANLY with code 25
        # ~5s after BlockManEchoesActivity starts (runs 38166105550 /
        # 38167324535). The wrap282 binary installs a seccomp-BPF filter
        # that makes exit(93)/exit_group(94) with code 25 or 30 return
        # -ENOSYS instead of terminating — the verdict becomes a no-op;
        # every other exit code and syscall passes through. AMS honors
        # the wrap.<pkg> property on ro.debuggable builds (redroid).
        run: |
          adb -s localhost:5555 root || true
          sleep 3
          adb -s localhost:5555 wait-for-device
          adb -s localhost:5555 push scripts/exithook/wrap282 /data/local/tmp/wrap282
          adb -s localhost:5555 push scripts/exithook/wraplog.sh /data/local/tmp/wraplog.sh
          adb -s localhost:5555 shell chmod 755 /data/local/tmp/wrap282 /data/local/tmp/wraplog.sh
          # v8: the property value is a LOGGING script — it appends every
          # wrapped-process invocation (pid + argv) to /data/local/tmp/
          # wraplog.txt then execs the seccomp wrapper. The wrapped process
          # runs as the APP uid, so pre-create the log world-writable.
          adb -s localhost:5555 shell "rm -f /data/local/tmp/wraplog.txt; touch /data/local/tmp/wraplog.txt; chmod 666 /data/local/tmp/wraplog.txt"
          # v13.2: the libbgscomp ctor reports its prctl results here (0666 —
          # the app uid writes; the file survives logcat rotation)
          adb -s localhost:5555 shell "rm -f /data/local/tmp/guardlog.txt; touch /data/local/tmp/guardlog.txt; chmod 666 /data/local/tmp/guardlog.txt"
          # v30: the supervisor child logs here — pre-create 666 (the app
          # uid CANNOT create new files in /data/local/tmp: the dir is
          # root:shell without o+w — the v30 run's "(no childlog)")
          adb -s localhost:5555 shell "rm -f /data/local/tmp/childlog.txt; touch /data/local/tmp/childlog.txt; chmod 666 /data/local/tmp/childlog.txt"
          # v31: ANDROID 12'S PHANTOM PROCESS KILLER. The supervisor is a
          # raw fork() of the app process — EXACTLY what AMS's phantom
          # process reaper hunts (untracked app-forked children). It was
          # killing the supervisor mid-init, stalling every notified
          # syscall and aborting the engine start. Disable it.
          adb -s localhost:5555 shell settings put global settings_enable_monitor_phantom_procs false || true
          adb -s localhost:5555 shell device_config put activity_manager max_phantom_processes 2147483647 || true
          echo "phantom procs monitor: $(adb -s localhost:5555 shell settings get global settings_enable_monitor_phantom_procs)"
          # v7 taught: Zygote.getWrapProperty(niceName) has NO pkg:proc->pkg
          # fallback; set the exact per-process-name properties. v8 taught
          # (run 38177186129): they ARE set+read back, yet :BlockmanGo still
          # exits 25 — this run's wraplog.txt answers WHO actually gets
          # wrapped. fail25 (all three execve attempts failed) now exits 27
          # so a clean exit 25 can ONLY be the TSS verdict.
          adb -s localhost:5555 shell setprop wrap.com.sandboxol.blockymods /data/local/tmp/wraplog.sh
          for PNAME in BlockmanGo ipc push; do
            adb -s localhost:5555 shell "setprop 'wrap.com.sandboxol.blockymods:$PNAME' /data/local/tmp/wraplog.sh"
            echo "wrap(.:$PNAME) => '$(adb -s localhost:5555 shell getprop wrap.com.sandboxol.blockymods:$PNAME)'"
          done
          echo "wrap property: $(adb -s localhost:5555 shell getprop wrap.com.sandboxol.blockymods)"
          echo "ro.debuggable:  $(adb -s localhost:5555 shell getprop ro.debuggable)"
          echo "ro.zygote:      $(adb -s localhost:5555 shell getprop ro.zygote)"
          # v9: run 38178524142's wraplog PROVED the boot fleet was wrapped
          # yet the join-time fleet was NOT (no wrap enter lines for
          # 3933/4729/4895) — and the wrapped/unwrapped pattern ALTERNATES
          # (fleet B 0.3s after fleet A). That is the STATIC USAP pool: a
          # pre-forked unspecialized process is served WITHOUT the wrapper
          # (the zygote server refills the pool asynchronously; the pool
          # path does not apply invoke-with). Disable the pool BEFORE any
          # app start so every fork takes the legacy path (which applies
          # wrap.<niceName>); AMS's DeviceConfig listener forwards it.
          adb -s localhost:5555 shell setprop persist.device_config.runtime_native.usap_pool_enabled false
          echo "usap disabled:  $(adb -s localhost:5555 shell getprop persist.device_config.runtime_native.usap_pool_enabled)"
          # selftest: the wrapper alone (install filter -> exec /system/bin/true).
          # 0 = the filter installs and exec works; 42 = EINVAL (errno 22+64);
          # 65 = EPERM; 102 = ENOSYS. Run 38172868682: the in-app path hit 42.
          # v5 fix: the ALLOW rets were assembled as 0x7FF00000 (TRACE, not
          # 0x7FFF0000 ALLOW) — TRACE with no ptracer fails EVERY syscall
          # with -ENOSYS, so the wrapper's own execve died. Rebuilt+verified
          # by byte-dump + a kernel-semantics BPF simulation before this run.
          set +e
          adb -s localhost:5555 shell /data/local/tmp/wraplog.sh /system/bin/true
          rc=$?
          echo "wrap selftest (via wraplog.sh) exit: $rc"
          echo "selftest wraplog: $(adb -s localhost:5555 shell cat /data/local/tmp/wraplog.txt | head -5)"
          adb -s localhost:5555 shell 'echo -n "device-side rc: "; /data/local/tmp/wrap282 /system/bin/true; echo $?'
          # v15 layer 2 — the fake-status bind-mount daemon. The libbgscomp
          # USER_NOTIF supervisor (layer 1, in-APK) scrubs /proc/self/status
          # via a memfd; this layer independently bind-mounts a scrubbed
          # copy over EVERY :BlockmanGo process's /proc/<pid>/status so the
          # TSS ctor's check reads "Seccomp: 0 / NoNewPrivs: 0" even if the
          # in-process install fails on-device. Root (adb root) + the
          # shared container mount namespace make the bind visible to the
          # app. The daemon logs each mount into .fs_mounted (evidence).
          adb -s localhost:5555 shell "rm -f /data/local/tmp/.fs_mounted /data/local/tmp/fs_[0-9]*"
          adb -s localhost:5555 shell 'cat > /data/local/tmp/fsloop.sh <<"FSEOF"
          #!/system/bin/sh
          M=/data/local/tmp/.fs_mounted
          touch $M
          while true; do
            for D in /proc/[0-9]*; do
              C=$(tr -d "\0" < $D/cmdline 2>/dev/null)
              case "$C" in
                *":BlockmanGo"*)
                  P=${D#/proc/}
                  grep -qx "$P" $M 2>/dev/null || {
                    sed "s/^Seccomp:.*/Seccomp:\t0/; s/^NoNewPrivs:.*/NoNewPrivs:\t0/" $D/status > /data/local/tmp/fs_$P 2>/dev/null
                    mount --bind /data/local/tmp/fs_$P $D/status 2>/dev/null && echo "$P" >> $M
                  }
                  ;;
              esac
            done
            sleep 0.5
          done
          FSEOF'
          adb -s localhost:5555 shell chmod 755 /data/local/tmp/fsloop.sh
          adb -s localhost:5555 shell 'nohup /data/local/tmp/fsloop.sh >/dev/null 2>&1 & echo "fsloop daemon: $!"'

      - name: Launch + 15s keep-alive
        run: |
          # v35: the engine's native init spams logcat (GL/audio/input
          # floods rotate the main ring before the harvest step reads it)
          # — quadruple the ring so the engine-pid evidence survives the
          # whole join watch.
          adb -s localhost:5555 logcat -G 4M || true
          adb -s localhost:5555 logcat -c
          adb -s localhost:5555 shell am start -n "$PACKAGE/$ACTIVITY"
          sleep 15
          if adb -s localhost:5555 shell pidof "$PACKAGE" | grep -qE '[0-9]'; then
            echo "APP ALIVE after 15s"
            adb -s localhost:5555 shell pidof "$PACKAGE"
          else
            echo "APP PROCESS DIED within 15s"
            adb -s localhost:5555 logcat -d | tail -150
            exit 1
          fi
          adb -s localhost:5555 exec-out screencap -p > boot282.png || true

      - name: LocalAPI holder probe (adb forward -> 18080)
        # The tpshell BaseApplication.onCreate hook must have started the
        # embedded server before any activity request. The FIRST responses
        # prove the metadata-driven API base reroutes correctly.
        run: |
          adb -s localhost:5555 forward tcp:18090 tcp:18080
          sleep 2
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /tmp/localapi_probe.json -w "%{http_code}" \
              "http://127.0.0.1:18090/config/files/blockymods-bannerv2" || true)
            [ "$CODE" = "200" ] && break
            echo "probe $i: http=$CODE (holder may still be binding)"; sleep 5
          done
          echo "final probe: http=$CODE"
          head -c 400 /tmp/localapi_probe.json || true
          [ "$CODE" = "200" ] || { echo "FATAL: 18080 holder did not answer"; \
            adb -s localhost:5555 logcat -d -s LocalAPI:* | tail -60; exit 1; }
          echo "== holder line config (gs: engine line log) =="
          adb -s localhost:5555 logcat -d -s LocalAPI:* | grep -E "gs: engine line|gs-line" | tail -5 || true

      - name: GameServer staging smoke (g10078 line)
        if: always()
        run: |
          # give the 42MB bundle download + engine boot a real window
          sleep 75
          echo "== gameserver process =="
          adb -s localhost:5555 shell "ps -A | grep -i gameserver" || true
          echo "== RakNet 31108 listen probe (/proc/net/udp, 31108=0x7994) =="
          adb -s localhost:5555 shell "cat /proc/net/udp" 2>/dev/null | grep -i '7994' || echo "no :7994 UDP socket visible to shell"
          echo "== FULL LocalAPI log (holder + gs pump) =="
          adb -s localhost:5555 logcat -d -s LocalAPI:* | tail -120 || true
          echo "== map placement =="
          adb -s localhost:5555 shell "ls -d /storage/emulated/*/SandBoxOL/BlockMan/map/* /storage/emulated/*/SandboxOL/BlockMan/map/* 2>/dev/null" || true
          adb -s localhost:5555 shell "find /storage/emulated/0/Android/data/$PACKAGE/files -maxdepth 4 -name map -type d 2>/dev/null" || true

      - name: Real UI join drive (282 GJ phase)
        # The REAL UI JOIN on the 2.8.2 client: attach to the live app ->
        # hall -> Bedwars (g1046, pinned first) card -> btn_enter ->
        # MiniGameToken -> JoinBridge takeover -> StartMc online ->
        # engine initGame 127.0.0.1:31108 gameType=g1008 -> C2S login ->
        # monitor g2r type=151. NO pm clear (it would wipe the staged
        # engine bundle). Hard-verdict checks per channel; exit 1 on any
        # miss so a silent local fallback can never green this workflow.
        run: |
          python3 scripts/ui_automation_test.py \
            --serial localhost:5555 \
            --package "$PACKAGE" \
            --activity "$ACTIVITY" \
            --line 282

      - name: Pull UI-join evidence
        if: always()
        run: |
          mkdir -p gjevidence
          echo "== seccomp guard file evidence =="
          adb -s localhost:5555 shell "cat /data/local/tmp/guardlog.txt 2>/dev/null" || true
          adb -s localhost:5555 shell "cat /data/user/0/com.sandboxol.blockymods/files/seccomp_guard.log 2>/dev/null" || echo "(no guard log)"
          echo "== v24b supervisor child log =="
          adb -s localhost:5555 shell "cat /data/local/tmp/childlog.txt 2>/dev/null" || echo "(no childlog)"
          echo "== v15 layer-2 fake-status mounts (.fs_mounted) =="
          adb -s localhost:5555 shell "cat /data/local/tmp/.fs_mounted 2>/dev/null" || echo "(no mounts)"
          echo "== bind mounts over proc status =="
          adb -s localhost:5555 shell "cat /proc/mounts 2>/dev/null | grep -E 'fs_[0-9]+|/proc/[0-9]+/status'" || echo "(none)"
          echo "== wraplog.txt (which processes actually got wrapped) =="
          adb -s localhost:5555 shell cat /data/local/tmp/wraplog.txt 2>/dev/null || echo "(no wraplog)"
          cp <(adb -s localhost:5555 shell cat /data/local/tmp/wraplog.txt 2>/dev/null) wraplog.txt 2>/dev/null || adb -s localhost:5555 shell cat /data/local/tmp/wraplog.txt > wraplog.txt 2>/dev/null || true
          adb -s localhost:5555 shell "ls /sdcard/ 2>/dev/null" | tr -d '\r' | grep 'snap_GJ282_' | while read -r f; do
            adb -s localhost:5555 pull "/sdcard/$f" gjevidence/ 2>/dev/null || true
          done
          ls -la gjevidence/ || echo "no GJ282 snaps (phase may not have run)"

      - name: Engine-integration harvest (v35)
        # Delta-8's prescription: the engine process is healthy but
        # initGame never fires / no client.log / no native thread farm.
        # Harvest the ENGINE-SIDE evidence: the full per-pid logcat (the
        # engine logs its own init progress), the probe chain markers
        # (EchoesProbe / "Main: so on game"), every log-shaped file under
        # the engine's staging trees, and the thread farm snapshot.
        if: always()
        run: |
          PKG="$PACKAGE"
          EPID=$(adb -s localhost:5555 shell pidof "$PKG:BlockmanGo" 2>/dev/null | tr -d '\r' | awk '{print $1}')
          echo "engine pid: ${EPID:-none}"
          echo "== [1] EchoesProbe chain markers (patched EchoesRenderer) =="
          adb -s localhost:5555 logcat -d | grep -E "EchoesProbe|so on game|router-jni" | tail -40 || echo "(no probe lines)"
          echo "== [2] FULL engine-pid logcat (all tags, last 500) =="
          if [ -n "$EPID" ]; then
            adb -s localhost:5555 logcat -d --pid="$EPID" 2>/dev/null | tail -500 > englog.txt || true
            wc -l englog.txt || true
            echo "-- englog head (first 60) --"
            head -60 englog.txt || true
            echo "-- englog tail (last 60) --"
            tail -60 englog.txt || true
            echo "== [2b] engine thread farm (ps -T) =="
            adb -s localhost:5555 shell "ps -T -p $EPID | head -40" || true
          else
            echo "(engine process gone — full-app logcat tail instead)"
            adb -s localhost:5555 logcat -d | tail -300 > englog.txt || true
          fi
          echo "== [3] engine log-file path mentions in logcat =="
          adb -s localhost:5555 logcat -d | grep -iE "client\.log|server\.log|logdir|log file|initlog|PathUtil" | tail -25 || echo "(none)"
          echo "== [4] SandBoxOL / BlockMan staging trees =="
          adb -s localhost:5555 shell "find /storage/emulated/0 -maxdepth 5 \( -iname '*sandboxol*' -o -iname '*blockman*' \) 2>/dev/null" | head -60 || true
          adb -s localhost:5555 shell "ls -laR /storage/emulated/0/SandBoxOL 2>/dev/null | head -120" || true
          echo "== [5] app-own files tree (root view) =="
          adb -s localhost:5555 shell "find /data/data/$PKG/files -maxdepth 3 2>/dev/null | head -80" || true
          adb -s localhost:5555 shell "find /data/media/0 -maxdepth 4 \( -iname '*sandboxol*' -o -iname '*blockman*' \) 2>/dev/null | head -40" || true
          echo "== [6] every *.log under those trees (name+size) =="
          adb -s localhost:5555 shell "find /storage/emulated/0 /data/data/$PKG/files /data/media/0 -maxdepth 6 \( -name '*.log' -o -name 'client*.txt' \) 2>/dev/null | head -40" || true
          echo "== [7] known client.log candidates: tails =="
          for D in $(adb -s localhost:5555 shell "ls -d /storage/emulated/*/SandBoxOL/BlockMan/config /storage/emulated/*/SandboxOL/BlockMan/config /storage/emulated/*/Android/data/$PKG/files/SandBoxOL/config 2>/dev/null" | tr -d '\r'); do
            echo "-- $D/client.log --"
            adb -s localhost:5555 shell "tail -c 900 $D/client.log 2>/dev/null" || echo "(absent)"
          done
          echo "== [8] the gs server.log (did the SERVER see anything?) =="
          for D in $(adb -s localhost:5555 shell "ls -d /storage/emulated/*/SandBoxOL/BlockMan/config 2>/dev/null" | tr -d '\r'); do
            adb -s localhost:5555 shell "tail -c 600 $D/server.log 2>/dev/null" || true
          done
          adb -s localhost:5555 logcat -d -s LocalAPI:* | grep -E "C2SPacketLogin|g2r|monitor" | tail -12 || true
          echo "== [9] TOMBSTONES (the full memory-near-pc dump = the SIGILL's runtime bytes) =="
          adb -s localhost:5555 shell "ls -la /data/tombstones 2>/dev/null" || true
          for T in /data/tombstones/tombstone_0*; do
            [ -e "$T" ] || continue
            echo "----- $T (head 150) -----"
            adb -s localhost:5555 shell "head -150 $T" 2>/dev/null | grep -vE "^$" | head -150 || true
          done
          mkdir -p tombstones
          adb -s localhost:5555 pull /data/tombstones tombstones/ 2>/dev/null || true
          ls -la tombstones/ 2>/dev/null | head -5 || true

      - name: Crash scan
        if: always()
        run: |
          echo "== FATAL/AndroidRuntime scan =="
          adb -s localhost:5555 logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime" | head -20 || echo "no fatal exceptions"
          echo "== native death scan =="
          adb -s localhost:5555 logcat -d | grep -iE "fatal signal|SIGSEGV|SIGABRT|SIGKILL|tombstone|DEBUG.*backtrace|libtersafe|tpshell|Force stopping|am_kill|lowmemorykiller.*blockymods" | head -30 || true
          echo "== tombstones =="
          adb -s localhost:5555 shell "ls -la /data/tombstones 2>/dev/null" || true
          echo "== am crash/ANR records =="
          adb -s localhost:5555 shell "dumpsys dropbox --print 2>/dev/null" | grep -iE "crash|anr|blockymods" | head -10 || true
          echo "== process table =="
          adb -s localhost:5555 shell "ps -A | grep blockymods" || echo "no blockymods processes"
          # v17: the engine survives but freezes in ptrace_stop (state t)
          # with zero proc-file notifications — identify the TRACER and
          # dump every thread's state/wchan.
          EPID=$(adb -s localhost:5555 shell "ps -A | grep ':BlockmanGo'" | awk '{print $2}' | head -1 | tr -d '\r')
          echo "engine pid: $EPID"
          if [ -n "$EPID" ]; then
            adb -s localhost:5555 shell 'cat > /data/local/tmp/engdiag.sh <<"DGEOF"
            #!/system/bin/sh
            P=$1
            [ -z "$P" ] && exit 0
            echo "== main status =="
            grep -E "^(State|Tgid|Pid|PPid|TracerPid)" /proc/$P/status 2>/dev/null
            echo "== thread states =="
            for T in /proc/$P/task/*; do
              echo "$T $(grep -E "^(State|TracerPid)" $T/status 2>/dev/null | tr "\n" " ")"
            done
            echo "== thread wchans =="
            for T in /proc/$P/task/*; do
              echo -n "${T##*/}: "; cat $T/wchan 2>/dev/null; echo
            done
            echo "== who traces the engine =="
            for D in /proc/[0-9]*; do
              TP=$(grep TracerPid $D/status 2>/dev/null | awk "{print \$2}" | tr -d "\r ")
              if [ "$TP" = "$P" ]; then
                echo "TRACER pid=${D#/proc/} cmd=$(tr -d "\0" < $D/cmdline 2>/dev/null)"
              fi
            done
            DGEOF'
            adb -s localhost:5555 shell chmod 755 /data/local/tmp/engdiag.sh
            adb -s localhost:5555 shell /data/local/tmp/engdiag.sh "$EPID" || true
          fi
          if adb -s localhost:5555 shell pidof "$PACKAGE" | grep -qE '[0-9]'; then
            echo "APP STILL ALIVE at end"
          else
            echo "APP DIED — capturing FULL death context"
            adb -s localhost:5555 logcat -d | tail -400 > death_logcat.txt || true
            adb -s localhost:5555 exec-out screencap -p > death282.png || true
            echo "== last 80 lines before death =="
            tail -80 death_logcat.txt || true
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-282-smoke
          path: |
            boot282.png
            death282.png
            death_logcat.txt
            englog.txt
            wraplog.txt
            tombstones/
            /tmp/localapi_probe.json
            gjevidence/
          if-no-files-found: ignore
